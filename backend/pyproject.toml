[project]
name = "employee-salaryslip-nippon-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "flask==3.0.3",
  "flask-sqlalchemy==3.1.1",
  "flask-cors==4.0.1",
  "flask-jwt-extended==4.6.0",
  "sqlalchemy==2.0.32",
  "psycopg2-binary==2.9.9",
  "python-dotenv==1.0.1",
  "openpyxl==3.1.5",
  "reportlab==4.2.2",
  "storage3>=2.28.0",
  "httpx>=0.27.0",
  "jinja2==3.1.4",
  "werkzeug==3.0.4",
  "bcrypt==4.2.0",
]

[project.optional-dependencies]
dev = [
  "pandas==2.2.2",
  "weasyprint==62.3",
  "celery==5.4.0",
  "redis==5.0.8",
  "gunicorn==22.0.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
install = "pip install --upgrade pip && pip install --prefer-binary -r requirements-vercel.txt"
